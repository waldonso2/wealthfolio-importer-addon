name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Actions are pinned to a commit (a tag can be moved); Dependabot keeps them current.
jobs:
  ci:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.23.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check:versions

      - run: pnpm type-check

      - run: pnpm lint

      - run: pnpm test:coverage

      - run: pnpm build

      # Known vulnerabilities in what ships in addon.js; dev tools are left to Dependabot.
      - run: pnpm audit --prod

      # Measured and reported on the run's summary page (docs/KENNZAHLEN.md), never failing the build.
      - run: pnpm perf
        continue-on-error: true

  dependency-review:
    # A pull request that adds a dependency with a known vulnerability is flagged.
    uses: waldonso2/quality-kit/.github/workflows/dependency-review.yml@2070c7e1ee07901a7313f6a005be303aa44acc04 # v1

  workflows:
    # The workflows themselves: injection, permissions, cache poisoning (zizmor).
    uses: waldonso2/quality-kit/.github/workflows/workflows.yml@2070c7e1ee07901a7313f6a005be303aa44acc04 # v1

  secrets:
    # gitleaks over the whole history; allowed test values in .gitleaks.toml.
    uses: waldonso2/quality-kit/.github/workflows/secrets.yml@2070c7e1ee07901a7313f6a005be303aa44acc04 # v1

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shared dedup cases match the sync service's copy (contract/dedup/README.md)
        run: |
          url=https://raw.githubusercontent.com/waldonso2/wealthfolio-broker-sync-service/main/contract/dedup/cases.json
          if ! curl -fsSL "$url" -o /tmp/other.json; then echo "The service has no copy on main yet - skipped."; exit 0; fi
          diff -u /tmp/other.json contract/dedup/cases.json || { echo "::error::contract/dedup/cases.json differs from the sync service's (leading) copy - copy it from there."; exit 1; }
