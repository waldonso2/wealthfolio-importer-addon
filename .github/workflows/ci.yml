name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Actions are pinned to a commit (a tag can be moved); Dependabot keeps them current.
jobs:
  ci:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.23.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check:versions

      - run: pnpm type-check

      - run: pnpm lint

      - run: pnpm test:coverage

      - run: pnpm build

      # Known vulnerabilities in what ships in addon.js; dev tools are left to Dependabot.
      - run: pnpm audit --prod

      # Measured and reported on the run's summary page (docs/KENNZAHLEN.md), never failing the build.
      - run: pnpm perf
        continue-on-error: true

  dependency-review:
    # A pull request that adds a dependency with a known vulnerability is flagged.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0

  workflows:
    # The workflows themselves: injection, permissions, cache poisoning (zizmor).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.31.1
          advanced-security: false
          min-severity: medium

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (whole history, see .gitleaks.toml)
        env:
          VERSION: 8.21.2
          SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git . --config .gitleaks.toml --redact --no-banner

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shared dedup cases match the sync service's copy (contract/dedup/README.md)
        run: |
          url=https://raw.githubusercontent.com/waldonso2/wealthfolio-broker-sync-service/main/contract/dedup/cases.json
          if ! curl -fsSL "$url" -o /tmp/other.json; then echo "The service has no copy on main yet - skipped."; exit 0; fi
          diff -u /tmp/other.json contract/dedup/cases.json || { echo "::error::contract/dedup/cases.json differs from the sync service's (leading) copy - copy it from there."; exit 1; }
